language: ko
status: planning_only_not_deployable
generated_at: '2026-09-12'
notice: 모델 선택/구간/파이프라인 설계 산출물. ClayFarm 코드 수정·설치·GPU/MPS/MLX 실행 검증은 수행하지 않음. 근거없는 성능 수치는 null이며 0이 아님.
normative_requirements:
- RTX 4050를 포함한 이기종 컴퓨터를 가입·승인·등록 가능한 워커 대상으로 한다.
- GPU 브랜드/모델명 whitelist로 사용자를 차단하지 않는다. 실행기 호환성 및 안전 실행 예산으로 각 기능을 판정한다.
- Apple Silicon을 CPU 전용으로 고정하지 않는다. MLX/MPS와 고메모리 모델을 실제 구현·시험 대상으로 포함한다.
- Windows/macOS CLI만으로 모든 계정·관리·설치·검증·업데이트를 수행할 수 있어야 한다.
- 구간은 모델 탐색 후보 집합이다. 구간에 속했다는 사실만으로 ready를 부여하지 않는다.
- 모델 크기/생성 해상도를 올리는 것과 출력 품질 향상을 동일시하지 않는다.
- VFX/UI/애니메이션 완제품은 모델 출력 외 조립·베이크·런타임 QA를 요구한다.
- 사용자 승인 없는 유료 API·외부 클라우드 생성으로 fallback하지 않는다.
hardware_bands:
- id: CPU
  description: GPU가 없거나 호환 실행기가 없는 장비
  purpose: CPU RAM·실측 처리시간에 따라 개별 허용
  assignment: nominal_capacity_seed_only_not_safety_budget
- id: C4
  description: CUDA 전용 메모리 4GB급
  purpose: 초경량 2D와 CPU 작업 중심
