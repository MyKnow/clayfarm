inventory_required:
- os
- architecture
- gpu_id
- gpu_name
- backend_versions
- device_memory_total_bytes
- device_memory_available_bytes
- unified_memory_total_bytes
- host_ram_available_bytes
- memory_pressure
- local_budget_bytes
- disk_cache_budget_bytes
- network_state
- power_thermal_policy
- driver_runtime_fingerprint
admission:
  must_pass:
  - owner_policy
  - membership_and_grant
  - asset_contract
  - license_and_access
  - pinned_signed_release
  - adapter_and_os_support
  - validated_model_backend_preset
  - current_device_and_host_headroom
  - input_envelope
  - runtime_quality_budget
  unknown_memory: calibration_only_under_explicit_limits_not_production_dispatch
  measure:
  - cold_load_seconds
  - warm_compute_seconds
  - full_pipeline_peak_device_bytes
  - full_pipeline_peak_host_bytes
  - process_and_driver_overhead
  - output_quality
  - transfer_seconds
  - ooms
  - interruptions
  - p95_wall_seconds
  activation: candidate -> installing -> smoke_pass -> workload_matrix_pass -> node_ready
  calibration_notice: 안전 여유와 동시성 한도는 현장 검증 전 근거없음/설계값. 외부 H200 수치를 현장 보장으로 복사하지 않음.
scheduling:
  objective: meet_required_quality_then_minimize_expected_completion_time
  time_components:
  - queue
  - uncached_download
  - cold_load
  - compute
  - result_upload
  - expected_retry_cost
  large_model_reservation: prefer smaller eligible nodes for light tasks when scarce high-memory node has queued
    exclusive tasks; do not strand work when no such demand exists
  fallback_order:
  - same-approved-contract memory optimization
  - another eligible node same locked profile
  - explicitly approved alternative model/preset
  - wait/needs-capacity
  never_silently_change:
  - model_revision
  - style_pack
  - output_contract
  - resolution_floor
  - animation_rig
  - license_scope
  - external_api_usage
  oom_scope: node+model+backend+profile+input-envelope, not entire node
  retry: transient pressure can retry later; deterministic over-budget configuration is quarantined until configuration/environment
    changes
  multi_gpu: independent stage/candidate tasks; no automatic cross-node VRAM aggregation
  offline: use signed cached policy and existing allowed leases; no unauthorized cloud fallback; durable outbox
    and idempotent commit/fencing
installation_policy:
  preinstall: shared runtime + one useful approved recipe per selected role; not every candidate model
  demand_load: true
  pinned_revisions_required: true
  separate_runtime_environments: true
  license_approval_required: true
  resumable_downloads: true
  checksum_and_signed_metadata_required: true
  cache_eviction: LRU within local disk budget, protect active jobs and designated last-good profile
  promotion: one compatible canary -> benchmark -> staged rollout; retain last-good environment
  lower_memory_modes: only explicit per-backend recipes; no arbitrary 4bit conversion or generic offload of unsupported
    kernels
artifact_contracts:
  3d_model:
  - mesh geometry
  - UV/material policy
  - GLB/FBX
  - scale/pivot/LOD/collider QA
  texture:
  - albedo and declared PBR maps
  - tile seams/UV matching
  - normal convention
  - bake settings
  vfx:
  - time-consistent flipbook or particle preset
  - alpha/atlas
  - material and runtime prefab
  - target-engine build/performance test
  ui:
  - raster/vector art
  - deterministic text/layout
  - 9-slice/atlas where needed
  - interactive template import test
  sfx:
  - WAV master
  - duration/channels/sample-rate
  - clipping/silence/loudness
  - semantic and loop QA
  rigging:
  - skeleton hierarchy
  - skin weights
  - rest pose
  - deformation test
  animation:
  - rig-compatible clips
  - root motion policy
  - loop/contact checks
  - FBX/GLB animation export
  - engine replay test
