[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "clayfarm-control"
version = "0.3.0.dev1"
description = "CLI-first ClayFarm control plane and hardware-adaptive model runtime"
requires-python = ">=3.11"
dependencies = ["fastapi==0.128.2", "uvicorn==0.48.0", "httpx==0.28.1", "pydantic==2.13.4", "SQLAlchemy==2.0.50", "cryptography==46.0.4", "keyring==25.7.0", "psutil==7.2.2"]

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.3.3"]
models = ["huggingface-hub==1.16.1"]
test = ["pytest==9.0.2"]

[project.scripts]
clayfarm = "clayfarm_control.cli:main"
assetgen = "clayfarm.cli:main"
assetnode = "clayfarm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clayfarm_control = ["data/*.json"]
clayfarm = ["skill.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
